name: TaxTrack
options:
  bundleIdPrefix: com.taxtrack
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  SWIFT_VERSION: "5.9"
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"
  PRODUCT_BUNDLE_IDENTIFIER: com.taxtrack.TaxTrack
  CODE_SIGN_STYLE: Automatic
  DEVELOPMENT_TEAM: ""
  SWIFT_OPTIMIZATION_LEVEL: "-Onone"
  TARGETED_DEVICE_FAMILY: "1"

targets:
  TaxTrack:
    type: application
    platform: iOS
    sources:
      - path: TaxTrack
        excludes:
          - "Resources/Info.plist"
    resources:
      - path: TaxTrack/Resources
    info:
      path: TaxTrack/Resources/Info.plist
      properties:
        CFBundleName: TaxTrack
        CFBundleDisplayName: TaxTrack
        CFBundleIdentifier: com.taxtrack.TaxTrack
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        NSLocationAlwaysAndWhenInUseUsageDescription: "TaxTrack needs your location to automatically track which tax jurisdiction you're in throughout the day."
        NSLocationAlwaysUsageDescription: "TaxTrack needs your location in the background to accurately track your tax residency status."
        NSLocationWhenInUseUsageDescription: "TaxTrack needs your location to determine which tax jurisdiction you're currently in."
        NSPhotoLibraryUsageDescription: "TaxTrack needs access to your photo library to attach documents and receipts as evidence."
        NSCameraUsageDescription: "TaxTrack needs camera access to photograph receipts, boarding passes, and other tax documents."
        UIBackgroundModes:
          - location
        NSLocationTemporaryUsageDescriptionDictionary:
          PreciseLocation: "TaxTrack uses your precise location to accurately determine your tax jurisdiction."
    settings:
      INFOPLIST_FILE: TaxTrack/Resources/Info.plist
      PRODUCT_NAME: TaxTrack
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ENABLE_PREVIEWS: YES
    dependencies: []
    scheme:
      testTargets:
        - TaxTrackTests
      environmentVariables:
        - variable: TAXTRACK_ENV
          value: development

  TaxTrackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TaxTrackTests
    dependencies:
      - target: TaxTrack
    settings:
      BUNDLE_LOADER: "$(TEST_HOST)"
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TaxTrack.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TaxTrack"

schemes:
  TaxTrack:
    build:
      targets:
        TaxTrack: all
    run:
      config: Debug
      commandLineArguments: {}
      environmentVariables:
        TAXTRACK_ENV: development
    test:
      config: Debug
      targets:
        - TaxTrackTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
